<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:css='false' b:defaultwidgetversion='2' b:layoutsVersion='3' b:responsive='true' b:templateUrl='indie.xml'
      b:templateVersion='1.3.3' expr:dir='data:blog.languageDirection' expr:lang='data:blog.locale'
      xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b'
      xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <b:skin version='1.3.3'><![CDATA[]]></b:skin>
    <meta charset='UTF-8'/>
    <link href='https://cdn.jsdelivr.net/gh/ptova/ReactOnBlogger@svil/public/favicon.svg' rel='icon'
          type='image/svg+xml'/>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
    <title>react_blogger</title>
</head>
<body>
<div id='root'/>
<div style="display: none">
    <b:section class='sidebar_top' id='sidebar_top' name='Sidebar (Top)'>
        <b:widget id='HTML2' locked='false' title='' type='HTML' visible='true'>
            <b:widget-settings>
                <b:widget-setting name='content'>
                    <![CDATA[
                    TO_REPLACE_SCRIPT
                    TO_REPLACE_CSS
                    ]]>
                </b:widget-setting>
            </b:widget-settings>
        </b:widget>
    </b:section>
    <div class='column-center-inner'>
        <b:section class='main' id='main' name='Main' showaddelement='no'>
            <b:widget id='Blog1' locked='true' title='Blog Posts' type='Blog' version='1'>
                <b:widget-settings>
                    <b:widget-setting name='showDateHeader'>true</b:widget-setting>
                    <b:widget-setting name='style.textcolor'>#ffffff</b:widget-setting>
                    <b:widget-setting name='showShareButtons'>false</b:widget-setting>
                    <b:widget-setting name='authorLabel'>By</b:widget-setting>
                    <b:widget-setting name='showCommentLink'>false</b:widget-setting>
                    <b:widget-setting name='style.urlcolor'>#ffffff</b:widget-setting>
                    <b:widget-setting name='showAuthor'>false</b:widget-setting>
                    <b:widget-setting name='style.linkcolor'>#ffffff</b:widget-setting>
                    <b:widget-setting name='style.unittype'>TextAndImage</b:widget-setting>
                    <b:widget-setting name='style.bgcolor'>#ffffff</b:widget-setting>
                    <b:widget-setting name='reactionsLabel'/>
                    <b:widget-setting name='showAuthorProfile'>false</b:widget-setting>
                    <b:widget-setting name='style.layout'>1x1</b:widget-setting>
                    <b:widget-setting name='showLabels'>true</b:widget-setting>
                    <b:widget-setting name='showLocation'>false</b:widget-setting>
                    <b:widget-setting name='showTimestamp'>false</b:widget-setting>
                    <b:widget-setting name='postsPerAd'>1</b:widget-setting>
                    <b:widget-setting name='showBacklinks'>false</b:widget-setting>
                    <b:widget-setting name='style.bordercolor'>#ffffff</b:widget-setting>
                    <b:widget-setting name='showInlineAds'>false</b:widget-setting>
                    <b:widget-setting name='showReactions'>false</b:widget-setting>
                </b:widget-settings>
            </b:widget>
        </b:section>
    </div>

</div>
</body>
</html>
